name: Differential parser replay

on: [push, pull_request]

permissions:
  contents: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic fixture generator
        run: python -m pip install z3-solver
      - name: Verify shared Z3 boundary fixtures
        run: python symbolic/parameter_boundaries.py --check tests/fixtures/parameters_boundaries.json
      - name: Build with AddressSanitizer and replay fixtures
        run: make CC=clang test-differential
      - name: Preserve counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parameter-counterexamples-${{ matrix.os }}
          path: out_diff/counterexamples/
          if-no-files-found: ignore
